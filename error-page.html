</style></head><body><main><div class="brand"><span class="logo" aria-hidden="true">▶</span><span>__APP__</span></div><p class="eyebrow">Workspace / __LABEL__</p><div class="layout"><div><h1>__TITLE__</h1><p class="message">__MESSAGE__</p><div class="actions"><a id="home" class="primary" href="/">Return to workspace</a><a id="signin" href="/">Sign in with another account</a></div></div><div class="code" aria-hidden="true">__CODE__</div></div><div class="footer"><span>HTTP __CODE__ · __LABEL__</span><span class="signal">Your workspace is one click away</span></div></main><script>const base=location.pathname.startsWith('/qa/')?'/qa/':'/';document.getElementById('home').href=base;document.getElementById('signin').href=base;if(document.title.startsWith('404'))document.getElementById('signin').hidden=true;document.getElementById('signin').onclick=async event=>{event.preventDefault();const link=event.currentTarget;link.textContent='Signing out…';try{const response=await fetch(base+'api/logout',{method:'POST'});if(!response.ok)throw Error();location.assign(base);}catch{link.textContent='Could not sign out. Try again.';}};</script></body></html>
