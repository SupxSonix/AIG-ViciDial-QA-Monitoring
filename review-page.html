<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Review a call</title><style>body{font:15px system-ui,sans-serif;color:#172940;background:#f2f5f9;margin:0;padding:16px 12px}main{max-width:620px;margin:auto;background:white;border:1px solid #d4dfe9;border-radius:14px;padding:20px}h1{font-size:22px;margin:0 0 8px}h2{font-size:18px;margin:10px 0 4px}p{line-height:1.4;color:#52667d;margin:8px 0}label{display:block;margin:10px 0 4px;font-weight:600}input,select,textarea,button{font:inherit;box-sizing:border-box;border:1px solid #bdcbd9;border-radius:6px;padding:8px;width:100%;color:#172940}audio{width:100%;height:36px;margin:8px 0}button{margin-top:12px;background:#087b87;color:white;cursor:pointer}button:disabled{opacity:.5}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:1px solid #587a9c;outline-offset:1px}[hidden]{display:none!important}.success{color:#166534}.error{color:#a22e2e}#original{white-space:pre-wrap;font-size:13px}small{display:block;color:#617387;font-size:12px;line-height:1.4;margin-top:6px}#original{max-height:64px;overflow:auto}textarea{resize:vertical}@media(max-width:480px){body{padding:10px 8px}main{padding:16px}}</style></head><body><main><h1>Review a call</h1><p id="status" role="status">Loading the review…</p><section id="review" hidden><h2 id="customer"></h2><p id="details"></p><audio id="audio" controls preload="none"></audio><p id="original"></p><form id="form"><label for="name">Approved by</label><input id="name" required maxlength="100" autocomplete="name" placeholder="Your full name"><label for="verdict">Response</label><select id="verdict" required><option value="">Choose a response</option><option value="valid">Valid</option><option value="invalid">Invalid</option><option value="unsure">Not sure</option></select><label for="notes">Review notes</label><textarea id="notes" rows="3" maxlength="3000"></textarea><small>Your name is recorded as entered. One submission is allowed. Your response is sent to the supervisor for application to the QA note.</small><button id="submit">Submit review</button></form></section></main><script>
const $=id=>document.getElementById(id),token=location.hash.slice(1);let blobUrl='';const base=location.pathname.replace(/review\/?$/,'');
async function api(action,body={}){const response=await fetch(base+'api/review-links/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,...body})});if(!response.ok){let result;try{result=await response.json();}catch{}throw Error(result?.error||'Could not complete this review.');}return response;}
(async()=>{try{const info=await (await api('info')).json();$('customer').textContent=info.recording.customer;$('details').textContent=info.recording.agent+' · '+info.recording.date+' · '+info.recording.time+' · Lead '+info.recording.lead;$('original').textContent='Current notes: '+(info.recording.notes||'None');$('status').textContent='This link expires '+new Date(info.expiresAt).toLocaleString()+'. You can listen repeatedly before submitting.';$('review').hidden=false;const audio=await api('audio');blobUrl=URL.createObjectURL(await audio.blob());$('audio').src=blobUrl;}catch(error){$('status').textContent=error.message;$('status').className='error';$('review').hidden=true;}})();
$('form').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;try{await api('submit',{name:$('name').value,verdict:$('verdict').value,notes:$('notes').value});$('audio').pause();$('audio').removeAttribute('src');if(blobUrl)URL.revokeObjectURL(blobUrl);$('review').hidden=true;$('status').className='success';$('status').textContent='Review submitted. Thank you. This link is now closed.';}catch(error){$('status').className='error';$('status').textContent=error.message;$('submit').disabled=false;}};
</script></body></html>
